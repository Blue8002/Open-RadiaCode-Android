name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java (JDK 11) einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Android SDK und NDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'
          accept-android-sdk-licenses: true

      - name: Gradle Wrapper ausführbar machen
        run: chmod +x gradlew
        working-directory: ./android_app

      - name: APK mit Gradle kompilieren (Debug)
        run: ./gradlew clean assembleDebug --info
        working-directory: ./android_app

      - name: APK-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android_app/app/build/outputs/apk/debug/*.apk
          
